<meta charset="UTF-8">

<style>
  .notfound-section { min-height: calc(100vh - 140px); display: flex; align-items: center; padding-block: 48px; }
  .notfound-inner { text-align: center; max-width: 560px; margin: 0 auto; }
  .notfound-code {
    font-size: clamp(4rem, 14vw, 7rem);
    font-weight: 800;
    line-height: 1;
    margin: 0 0 12px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.03em;
  }
  .notfound-title { font-size: 1.5rem; margin: 0 0 14px; }
  .notfound-sub { color: var(--text-muted); margin: 0 0 32px; }
  .notfound-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
    text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); box-shadow: var(--shadow); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .btn-ghost { border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header class="site-header" id="top">
  <div class="container header-inner">
    <a class="brand" href="index.html" aria-label="Systems Hub — হোমে যান">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span class="brand-text">Systems<span class="brand-accent">Hub</span></span>
    </a>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="থিম পরিবর্তন করুন" title="Dark / Light">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="notfound-section">
    <div class="container notfound-inner">
      <p class="notfound-code">404</p>
      <h1 class="notfound-title">এই পেজটা খুঁজে পাওয়া যায়নি</h1>
      <p class="notfound-sub">লিংকটা হয়তো ভুল, অথবা পেজটা সরিয়ে ফেলা হয়েছে। নিচের অপশন থেকে হোমে ফিরে যেতে পারেন।</p>
      <div class="notfound-actions">
        <a class="btn btn-primary" href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Systems Hub-এ ফিরে যান
        </a>
        <a class="btn btn-ghost" href="index.html#projects">সব সিস্টেম দেখুন</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p class="footer-copy">© <span id="year"></span> Subroto Das. সর্বস্বত্ব সংরক্ষিত।</p>
</footer>

<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    document.getElementById("themeToggle").addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
    document.getElementById("year").textContent = new Date().getFullYear();
  })();
</script>
</body>
</html>

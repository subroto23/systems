name: Ping IndexNow

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow (Bing, Yandex, etc.)
        run: |
          KEY="66c009ec32b65b3c711f9a804cdcdcd6"
          HOST="systems.subromart.com"
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | sed 's/^/"/;s/$/"/' | paste -sd, -)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[$URLS]}" \
            -o /dev/null -w "IndexNow response: %{http_code}\n" || true
